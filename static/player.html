<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EmpowerTours Radio — music from the artists, on-chain</title>
<meta name="description" content="Stream music minted by EmpowerTours artists. No wallet, no sign-in — just press play." />
<meta property="og:title" content="EmpowerTours Radio" />
<meta property="og:description" content="Music from the artists, on-chain. Press play." />
<meta property="og:type" content="music.radio_station" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#17121f; --bg2:#211829; --surface:#2a2036; --surface2:#332741;
    --cream:#f3e9da; --muted:#a99db8; --amber:#f6b03c; --coral:#ff5e7a;
    --line:rgba(243,233,218,.10); --line2:rgba(243,233,218,.06);
    --shadow:0 24px 60px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 78% -10%, rgba(246,176,60,.16), transparent 60%),
      radial-gradient(900px 500px at 8% 8%, rgba(255,94,122,.12), transparent 55%),
      var(--bg);
    color:var(--cream);
    font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:16px; line-height:1.5;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:112px; /* room for the play bar */
  }
  a{color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}

  /* ---- top bar ---- */
  header{position:sticky;top:0;z-index:20;
    backdrop-filter:blur(14px);
    background:linear-gradient(var(--bg), rgba(23,18,31,.72));
    border-bottom:1px solid var(--line2)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--coral);
    box-shadow:0 0 0 0 rgba(255,94,122,.6);animation:pulse 2.6s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,94,122,.55)}70%{box-shadow:0 0 0 12px rgba(255,94,122,0)}100%{box-shadow:0 0 0 0 rgba(255,94,122,0)}}
  .wordmark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em;font-size:20px}
  .wordmark b{color:var(--amber);font-weight:800}
  .tag{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:5px 10px}

  /* ---- hero / tuner ---- */
  .hero{padding:34px 0 22px}
  .kicker{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
  .tuner{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:center;
    background:linear-gradient(180deg,var(--surface),var(--bg2));
    border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .tuner::before{content:"";position:absolute;inset:-1px;border-radius:22px;padding:1px;
    background:linear-gradient(120deg,rgba(246,176,60,.5),transparent 30%,transparent 70%,rgba(255,94,122,.4));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .art{aspect-ratio:1;width:100%;border-radius:16px;background:var(--surface2) center/cover no-repeat;
    box-shadow:0 18px 40px -14px rgba(246,176,60,.35), inset 0 0 0 1px var(--line);
    position:relative}
  .art .spin{position:absolute;right:-9px;bottom:-9px;width:44px;height:44px;border-radius:50%;
    background:conic-gradient(from 0deg,#0d0a12,#3a2e49,#0d0a12);border:3px solid var(--bg);
    display:grid;place-items:center}
  .art .spin::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--amber)}
  .np-meta{min-width:0}
  .np-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em;
    font-size:clamp(28px,5vw,46px);line-height:1.02;margin:2px 0 8px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np-artist{color:var(--muted);font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chip{font-family:"Space Mono",monospace;font-size:11px;color:var(--cream);
    background:rgba(246,176,60,.12);border:1px solid rgba(246,176,60,.3);border-radius:999px;padding:3px 8px}

  /* signature: waveform */
  .wave{display:flex;align-items:flex-end;gap:3px;height:34px;margin:18px 0 6px}
  .wave i{flex:1;max-width:6px;background:linear-gradient(var(--amber),var(--coral));border-radius:3px;height:20%;opacity:.5}
  body.playing .wave i{animation:bounce 1s ease-in-out infinite;opacity:1}
  .wave i:nth-child(4n){animation-delay:-.2s}.wave i:nth-child(3n){animation-delay:-.5s}
  .wave i:nth-child(2n){animation-delay:-.35s}.wave i:nth-child(5n){animation-delay:-.65s}
  @keyframes bounce{0%,100%{height:18%}50%{height:100%}}

  .hero-actions{display:flex;align-items:center;gap:14px;margin-top:14px}
  .play-lg{display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    font-weight:600;font-size:16px;color:#1a1220;background:var(--amber);
    border:none;border-radius:999px;padding:13px 22px;transition:transform .12s ease, box-shadow .2s}
  .play-lg:hover{transform:translateY(-1px);box-shadow:0 12px 26px -10px rgba(246,176,60,.7)}
  .play-lg svg{display:block}

  /* ---- tracklist ---- */
  .list-head{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 10px}
  .list-head h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;letter-spacing:-.01em;font-size:22px;margin:0}
  .count{font-family:"Space Mono",monospace;font-size:12px;color:var(--muted)}
  ul.tracks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .track{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;
    padding:10px;border-radius:14px;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s}
  .track:hover{background:var(--surface);border-color:var(--line)}
  .track.active{background:var(--surface);border-color:rgba(246,176,60,.4)}
  .thumb{width:52px;height:52px;border-radius:11px;background:var(--surface2) center/cover no-repeat;position:relative;flex:none}
  .thumb .eq{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:2px;background:rgba(23,18,31,.55);border-radius:11px}
  .track.active .thumb .eq{display:flex}
  .thumb .eq i{width:3px;height:8px;background:var(--amber);border-radius:2px}
  body.playing .track.active .thumb .eq i{animation:bounce 900ms ease-in-out infinite}
  .thumb .eq i:nth-child(2){animation-delay:-.3s}.thumb .eq i:nth-child(3){animation-delay:-.6s}
  .t-name{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-artist{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-badge{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px}

  /* ---- states ---- */
  .state{padding:56px 0;text-align:center;color:var(--muted)}
  .state b{display:block;color:var(--cream);font-family:"Bricolage Grotesque",sans-serif;font-size:20px;margin-bottom:6px;font-weight:700}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--amber);border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{color:var(--muted);font-size:13px;text-align:center;padding:40px 0 8px;border-top:1px solid var(--line2);margin-top:44px}
  footer a{color:var(--cream);text-decoration:none;border-bottom:1px solid var(--line)}

  /* ---- persistent play bar ---- */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.7,.2,1);
    background:linear-gradient(180deg,rgba(42,32,54,.86),rgba(23,18,31,.96));backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .bar.show{transform:none}
  .bar-in{max-width:1040px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
  .bar .thumb{width:46px;height:46px}
  .bar-meta{min-width:0;flex:1}
  .bar-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-artist{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctrl{display:flex;align-items:center;gap:6px}
  .ib{background:none;border:none;color:var(--cream);cursor:pointer;padding:8px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
  .ib:hover{background:var(--surface2)}
  .play-sm{background:var(--amber);color:#1a1220}
  .play-sm:hover{background:var(--amber);filter:brightness(1.05)}
  .progress{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
  .progress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--coral))}

  @media(max-width:640px){
    .tuner{grid-template-columns:1fr;text-align:left}
    .art{width:150px}
    .np-name{white-space:normal}
    .t-badge{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <a class="brand" href="/">
      <span class="dot" aria-hidden="true"></span>
      <span class="wordmark">Empower<b>Tours</b> Radio</span>
    </a>
    <span class="tag">On-chain · Live</span>
  </div>
</header>

<main class="wrap" id="app">
  <section class="hero" id="hero" hidden>
    <p class="kicker">Now playing</p>
    <div class="tuner">
      <div class="art" id="np-art"><span class="spin" aria-hidden="true"></span></div>
      <div class="np-meta">
        <h1 class="np-name" id="np-name">—</h1>
        <div class="np-artist"><span id="np-artist">—</span><span class="chip" id="np-fid" hidden></span></div>
        <div class="wave" id="wave" aria-hidden="true"></div>
        <div class="hero-actions">
          <button class="play-lg" id="hero-play">
            <svg id="hero-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span id="hero-label">Play</span>
          </button>
          <button class="play-lg" id="shuffle-btn" style="background:transparent;color:var(--cream);box-shadow:none;border:1px solid var(--line)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            <span>Shuffle</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section id="listSection" hidden>
    <div class="list-head">
      <h2>The catalog</h2>
      <span class="count" id="count"></span>
    </div>
    <ul class="tracks" id="tracks"></ul>
  </section>

  <div class="state" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    Tuning in…
  </div>
  <div class="state" id="empty" hidden>
    <b>No tracks yet</b>
    The artists are warming up. Check back soon.
  </div>
  <div class="state" id="error" hidden>
    <b>Couldn't reach the studio</b>
    <span id="error-msg">Try again in a moment.</span>
  </div>
</main>

<footer class="wrap">
  Music minted by artists on <a href="https://fcempowertours-production-6551.up.railway.app" target="_blank" rel="noopener">EmpowerTours</a>, powered by Monad + Farcaster.
</footer>

<div class="bar" id="bar" role="region" aria-label="Player">
  <div class="progress"><div class="fill" id="fill"></div></div>
  <div class="bar-in">
    <div class="thumb" id="bar-art"></div>
    <div class="bar-meta">
      <div class="bar-name" id="bar-name">—</div>
      <div class="bar-artist" id="bar-artist">—</div>
    </div>
    <div class="ctrl">
      <button class="ib" id="prev" aria-label="Previous track"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="ib play-sm" id="toggle" aria-label="Play or pause"><svg id="bar-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ib" id="next" aria-label="Next track"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function(){
  var PLAY='<path d="M8 5v14l11-7z"/>';
  var PAUSE='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  var songs=[], idx=-1, hist=[];
  var audio=document.getElementById('audio');

  var el=function(id){return document.getElementById(id)};
  function shortAddr(a){ if(!a) return 'Unknown artist'; return a.length>12 ? a.slice(0,6)+'…'+a.slice(-4) : a; }
  function artistLabel(s){ return s.artistName || shortAddr(s.artist); }
  // This is a radio: shuffle the order and pick random next tracks.
  function shuffleArr(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function pickRandom(len, ex){ if(len<=1) return 0; var r=ex; while(r===ex) r=Math.floor(Math.random()*len); return r; }
  function randomNext(){ if(songs.length) playAt(pickRandom(songs.length, idx)); }
  function goPrev(){ if(hist.length>=2){ hist.pop(); loadInto(hist[hist.length-1], true); } else { randomNext(); } }

  // build waveform bars once
  var wave=el('wave'); for(var i=0;i<28;i++){ wave.appendChild(document.createElement('i')); }

  function render(){
    el('count').textContent = songs.length + (songs.length===1?' track':' tracks');
    var ul=el('tracks'); ul.innerHTML='';
    songs.forEach(function(s,i){
      var li=document.createElement('li');
      li.className='track'; li.dataset.i=i;
      li.innerHTML=
        '<div class="thumb" style="'+(s.imageUrl?'background-image:url('+CSS.escape(s.imageUrl)+')':'')+'">'
          +'<div class="eq"><i></i><i></i><i></i></div></div>'
        +'<div style="min-width:0"><div class="t-name">'+esc(s.name||'Untitled')+'</div>'
          +'<div class="t-artist">'+esc(artistLabel(s))+'</div></div>'
        +'<span class="t-badge">#'+esc(s.tokenId)+'</span>';
      li.addEventListener('click',function(){ playAt(+this.dataset.i); });
      ul.appendChild(li);
    });
    el('listSection').hidden=false;
    el('hero').hidden=false;
    if(idx<0) loadInto(0,false); // prime hero without autoplay
  }
  function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;}

  function loadInto(i, autoplay){
    if(i<0||i>=songs.length) return;
    idx=i; var s=songs[i];
    // hero
    el('np-name').textContent=s.name||'Untitled';
    el('np-artist').textContent=artistLabel(s);
    var fid=el('np-fid'); if(s.artistFid){fid.hidden=false;fid.textContent='fid '+s.artistFid;}else{fid.hidden=true;}
    el('np-art').style.backgroundImage=s.imageUrl?'url('+s.imageUrl+')':'';
    // bar
    el('bar-name').textContent=s.name||'Untitled';
    el('bar-artist').textContent=artistLabel(s);
    el('bar-art').style.backgroundImage=s.imageUrl?'url('+s.imageUrl+')':'';
    // active row
    Array.prototype.forEach.call(document.querySelectorAll('.track'),function(t){
      t.classList.toggle('active', +t.dataset.i===i);
    });
    audio.src=s.audioUrl;
    el('bar').classList.add('show');
    if(autoplay) audio.play().catch(function(){});
  }
  function playAt(i){ hist.push(i); loadInto(i,true); }

  function setPlaying(p){
    document.body.classList.toggle('playing',p);
    el('bar-icon').innerHTML=p?PAUSE:PLAY;
    el('hero-icon').innerHTML=p?PAUSE:PLAY;
    el('hero-label').textContent=p?'Pause':'Play';
  }
  function toggle(){
    if(idx<0) return randomNext();
    if(audio.paused) audio.play().catch(function(){}); else audio.pause();
  }

  el('toggle').addEventListener('click',toggle);
  el('hero-play').addEventListener('click',toggle);
  el('shuffle-btn').addEventListener('click',randomNext);
  el('next').addEventListener('click',randomNext);
  el('prev').addEventListener('click',goPrev);
  audio.addEventListener('play',function(){setPlaying(true)});
  audio.addEventListener('pause',function(){setPlaying(false)});
  audio.addEventListener('ended',randomNext);
  audio.addEventListener('timeupdate',function(){
    var pct=audio.duration?(audio.currentTime/audio.duration*100):0;
    el('fill').style.width=pct+'%';
  });

  function show(id){['loading','empty','error'].forEach(function(s){el(s).hidden=(s!==id)});}

  fetch('/api/v1/music',{headers:{'accept':'application/json'}})
    .then(function(r){ if(!r.ok) throw new Error('status '+r.status); return r.json(); })
    .then(function(j){
      songs=shuffleArr((j.data&&j.data.songs)||[]);
      el('loading').hidden=true;
      if(!songs.length){ show('empty'); return; }
      show(''); render();
    })
    .catch(function(e){
      el('loading').hidden=true;
      el('error-msg').textContent='Try again in a moment. ('+e.message+')';
      show('error');
    });
})();
</script>
</body>
</html>
